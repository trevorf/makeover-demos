<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 600px; }
    .indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #60a5fa; box-shadow: 0 0 24px #60a5fa; margin-bottom: 16px; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.04em; margin: 0 0 16px; }
    p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <main>
    <span class="indicator" aria-hidden="true"></span>
    <h1>Coming soon.</h1>
    <p>Something new is in development. Check back soon.</p>
  </main>
</body>
</html>
